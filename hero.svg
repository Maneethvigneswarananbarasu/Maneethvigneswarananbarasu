<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#05070d"/>
    <stop offset="50%" stop-color="#0b1020"/>
    <stop offset="100%" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0%" stop-color="#00f5d4"/>
    <stop offset="50%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#00f5d4"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  <style>
    .mono{font-family:monospace}
    .cursor{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 5s linear infinite}
    .float{animation:float 4s ease-in-out infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(460px)}}
    @keyframes float{50%{transform:translateY(-5px)}}
  </style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#20283a"/>
<g opacity=".13">
